<section class="page-section">
  <div class="container">
    <div class="section-heading text-center mx-auto fade-in-section">
      <span class="section-label">Gallery</span>
      <h1>Behind the scenes from pond to hive</h1>
      <p>Simple visuals that reflect the natural setting, careful handling, and local freshness behind every order.</p>
    </div>

    <div class="row g-4 mt-1">
      @for (item of galleryItems; track item.id) {
        <div class="col-sm-6 col-lg-3">
          <article class="gallery-card fade-in-section">
            <div class="gallery-image-wrap">
              <img [src]="item.image" [alt]="item.title" class="gallery-image" />
              <div class="gallery-overlay">
                <h3>{{ item.title }}</h3>
                <p>{{ item.description }}</p>
              </div>
            </div>
          </article>
        </div>
      }
    </div>
  </div>
</section>
